databases:
  - name: uyir-thuli-ems-db
    databaseName: uyir_thuli_ems
    user: uyir_thuli_ems
    plan: free

services:
  - type: web
    name: uyir-thuli-ems-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: https://uyir-thuli-ems-web.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://uyir-thuli-ems-web.onrender.com
      - key: FRONTEND_URL
        value: https://uyir-thuli-ems-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: uyir-thuli-ems-db
          property: connectionString

  - type: web
    name: uyir-thuli-ems-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_HOST
        fromService:
          type: web
          name: uyir-thuli-ems-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
